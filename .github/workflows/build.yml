name: Build Reel Remixer

# Every push to main builds Mac + Windows and publishes them as the newest Release,
# so https://github.com/<owner>/reel-remixer/releases/latest always has the current downloads.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14          # Apple Silicon runner, builds for M1 and later
            zip: Reel-Remixer-Mac.zip
            exe: "dist/Reel Remixer.app/Contents/MacOS/Reel Remixer"
          - os: windows-latest
            zip: Reel-Remixer-Windows.zip
            exe: "dist/Reel Remixer/Reel Remixer.exe"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow

      - name: Build
        run: python build.py

      - name: Check the bundled ffmpeg works
        shell: bash
        run: '"${{ matrix.exe }}" --selftest'

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.zip }}
          path: dist/${{ matrix.zip }}

  release:
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: out
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build-{0}', github.run_number) }}
          name: Reel Remixer ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('build {0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: out/*.zip
          body: |
            **Mac (M1 or newer):** download Reel-Remixer-Mac.zip
            **Windows:** download Reel-Remixer-Windows.zip

            First-time setup is in the README.
